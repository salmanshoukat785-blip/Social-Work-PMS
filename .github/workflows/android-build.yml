name: Android Build

# What this does
#  1. If a project zip (SocialWorkAcademy_*.zip) is in the repository root or in upload/, it is unpacked over the project
#     (old app/src files are removed first, so no stale file from an earlier phase can break the build).
#  2. Builds the debug APK and uploads it as the artifact "SocialWorkAcademy-debug-apk".
#  3. Runs the unit tests and the Android lint check. Their result is reported, and the APK is
#     kept even if a test fails, so you can still install it. A failed test makes the run red at the end.
#  4. Commits the unpacked files and removes the zip.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack zip from the repository root or upload/ (if any)
        id: unpack
        shell: bash
        run: |
          shopt -s nullglob
          zips=(upload/*.zip *.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found, building the repository as it is."
            echo "unpacked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf /tmp/unz && mkdir /tmp/unz
          for z in "${zips[@]}"; do
            echo "Unpacking $z"
            unzip -oq "$z" -d /tmp/unz
          done
          marker=$(find /tmp/unz -name settings.gradle.kts | head -n 1)
          if [ -z "$marker" ]; then
            echo "::error::No settings.gradle.kts found inside the zip. Zip the contents of the project folder (gradlew, app/, settings.gradle.kts ...)."
            exit 1
          fi
          root=$(dirname "$marker")
          if [ -d "$root/app/src" ]; then
            echo "Removing the old app/src so no file from an earlier phase is left behind."
            rm -rf app/src
          fi
          rsync -a --exclude='.github' --exclude='upload' "$root"/ ./
          echo "unpacked=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read the app version
        id: version
        shell: bash
        run: |
          v=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=${v:-unknown}" >> "$GITHUB_OUTPUT"
          echo "App version: ${v:-unknown}"

      - name: Build debug APK
        id: apk
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/SocialWorkAcademy-${{ steps.version.outputs.name }}-debug.apk"
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialWorkAcademy-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check that the APK asks for no network permission
        id: perms
        continue-on-error: true
        shell: bash
        run: |
          aapt2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions dist/*.apk | tee permissions.txt
          if grep -qi "INTERNET" permissions.txt; then
            echo "::warning::The APK asks for the INTERNET permission. The app is meant to be offline-only."
            exit 1
          fi
          echo "No INTERNET permission. Good."

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit unpacked files and remove the zip
        if: success() && steps.unpack.outputs.unpacked == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f upload/*.zip *.zip
          rm -rf dist permissions.txt
          git add -A -- . ':!.github'
          git update-index --chmod=+x gradlew || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Unpack uploaded project zip (version ${{ steps.version.outputs.name }})"
            git push
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Social Work Academy build"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Version | ${{ steps.version.outputs.name }} |"
            echo "| Debug APK | ${{ steps.apk.outcome }} |"
            echo "| No network permission | ${{ steps.perms.outcome }} |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo ""
            echo "The APK is under **Artifacts** at the bottom of this page (SocialWorkAcademy-debug-apk)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the run red if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::The APK was built, but some unit tests failed. Download the 'unit-test-report' artifact to see which."
          exit 1
